# docker-compose.yml
version: '3.8'

services:
  # Database Container (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tesla_password123
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Container (Node.js API)
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      # 'db' হলো উপরের সার্ভিসটির নাম
      DATABASE_URL: postgresql://postgres:tesla_password123@db:5432/dhaka_tesla_pool?schema=public
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy # ডাটাবেস পুরোপুরি রেডি হওয়ার পর ব্যাকএন্ড চালু হবে

  # Frontend Container (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: